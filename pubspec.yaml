name: swdart
description: >-
  Program and debug ARM Cortex-M microcontrollers over ST-Link in pure Dart —
  WebUSB in the browser, libusb on desktop. STM32F0/F1/F3, GigaDevice GD32F103/
  GD32E103, Artery AT32F415 and Nordic nRF51/nRF52 (flash + read-protection,
  incl. locked-nRF recovery), with abstractions for adding more targets.
version: 0.2.0
repository: https://github.com/nopbxlr/swdart
issue_tracker: https://github.com/nopbxlr/swdart/issues
topics:
  - arm
  - cortex-m
  - stlink
  - swd
  - embedded

environment:
  sdk: ^3.5.0

dependencies:
  # Native libusb FFI (calloc/malloc helpers). Unused on web builds, where the
  # transport is WebUSB via dart:js_interop.
  ffi: ^2.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
